<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yufan Zhou — CV</title>
  <meta name="description" content="Curriculum Vitae of Yufan Zhou, Communication Engineering student at Xiamen University.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Yufan Zhou — CV">
  <meta property="og:description" content="Curriculum Vitae of Yufan Zhou, Communication Engineering student at Xiamen University.">
  <meta property="og:url" content="https://yufanzhou142.github.io/cv.html">
  <meta property="og:image" content="https://yufanzhou142.github.io/assets/vann1.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .cv-page .content {
      max-width: 1000px;
    }
    .cv-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .cv-header h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--heading-color);
    }
    .cv-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .cv-actions a {
      display: inline-block;
      padding: 8px 16px;
      background: var(--link-color);
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-family: var(--font-mono);
      transition: opacity 0.2s;
    }
    .cv-actions a:hover {
      opacity: 0.85;
    }
    .pdf-container {
      width: 100%;
      height: calc(100vh - 200px);
      min-height: 600px;
      border: 1px solid var(--border-color, #ddd);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-content);
    }
    .pdf-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .cv-footer {
      margin-top: 24px;
      text-align: center;
      color: var(--text-color);
      opacity: 0.7;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="page cv-page">
    <div class="layout">
      <aside class="side-nav" aria-label="Section navigation">
        <div class="side-nav-title">Navigation</div>
        <a href="index.html#top">Home</a>
        <a href="index.html#about">About Me</a>
        <a href="index.html#news">News</a>
        <a href="index.html#papers">Selected Papers</a>
        <a href="index.html#educations">Educations</a>
        <a href="index.html#research-intern">Research Intern</a>
        <a href="index.html#competitions">Competitions &amp; Patents</a>
        <a href="index.html#achievements">Achievements</a>
        <a href="index.html#misc">Misc</a>
        <div class="theme-toggle">
          <button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle dark mode">
            <span class="icon" id="theme-icon">🌙</span>
            <span id="theme-label">Dark</span>
          </button>
        </div>
      </aside>

      <div class="content">
        <section id="top" class="section-block">
          <div class="cv-header">
            <h1>Curriculum Vitae</h1>
            <div class="cv-actions">
              <a href="assets/cv/Yufan_Zhou-Xiamen_University-2023.pdf" target="_blank" rel="noopener">Open PDF</a>
              <a href="assets/cv/Yufan_Zhou-Xiamen_University-2023.pdf" download>Download</a>
            </div>
          </div>
          <div class="pdf-container">
            <iframe src="assets/cv/Yufan_Zhou-Xiamen_University-2023.pdf" title="Yufan Zhou CV PDF"></iframe>
          </div>
        </section>

        <div class="cv-footer">
          <a href="index.html" style="color: var(--link-color);">&larr; Back to Homepage</a>
        </div>
      </div>
    </div>
  </div>

<script>
  (function() {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    var icon = document.getElementById('theme-icon');
    var label = document.getElementById('theme-label');

    function getStored() { return localStorage.getItem('theme'); }
    function isDark() { return getStored() === 'dark'; }

    function apply(dark) {
      if (dark) {
        root.setAttribute('data-theme', 'dark');
        icon.textContent = '☀️';
        label.textContent = 'Light';
      } else {
        root.setAttribute('data-theme', 'light');
        icon.textContent = '🌙';
        label.textContent = 'Dark';
      }
      document.querySelector('meta[name="theme-color"]')
        .setAttribute('content', dark ? '#111827' : '#ffffff');
    }

    apply(isDark());

    btn.addEventListener('click', function() {
      var next = !isDark();
      localStorage.setItem('theme', next ? 'dark' : 'light');
      apply(next);
    });
  })();
</script>
</body>
</html>
